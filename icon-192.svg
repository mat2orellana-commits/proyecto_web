<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a0f2e"/>
      <stop offset="100%" stop-color="#12030f"/>
    </radialGradient>
    <radialGradient id="bomb" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#4b1a4d"/>
      <stop offset="70%" stop-color="#250a26"/>
      <stop offset="100%" stop-color="#160418"/>
    </radialGradient>
    <radialGradient id="petal" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f9a8e8"/>
      <stop offset="100%" stop-color="#d957c0"/>
    </radialGradient>
    <radialGradient id="flowerCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd6f5"/>
      <stop offset="100%" stop-color="#e879d0"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a235f"/>
      <stop offset="100%" stop-color="#2a0f2b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <!-- Sakura petal shape -->
    <path id="sakuraPetal" d="M0,0 C25,-30 55,-45 80,-40 C95,-30 90,5 70,30 C50,55 20,60 0,45 C-15,30 -15,15 0,0 Z"/>
    <!-- 4-point sparkle star -->
    <path id="spark" d="M0,-60 L8,-8 L60,0 L8,8 L0,60 L-8,8 L-60,0 L-8,-8 Z"/>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Magic circle ring -->
  <circle cx="512" cy="522" r="350" fill="none" stroke="#c94fc0" stroke-width="6" opacity="0.7"/>
  <circle cx="512" cy="522" r="350" fill="none" stroke="#f0a0e8" stroke-width="2" opacity="0.8" stroke-dasharray="140 60 30 90"/>

  <!-- Swirl brush strokes around ring -->
  <path d="M180,640 C120,540 160,420 260,370 C200,470 210,560 280,620" fill="none" stroke="#e879d0" stroke-width="14" opacity="0.75" stroke-linecap="round"/>
  <path d="M850,640 C910,545 870,430 765,375 C820,470 815,565 745,625" fill="none" stroke="#e879d0" stroke-width="14" opacity="0.75" stroke-linecap="round"/>
  <path d="M280,790 C360,860 460,890 560,885" fill="none" stroke="#c94fc0" stroke-width="10" opacity="0.6" stroke-linecap="round"/>

  <!-- Bomb body -->
  <circle cx="512" cy="520" r="205" fill="url(#bomb)" stroke="#e879d0" stroke-width="3"/>
  <path d="M340,430 A205,205 0 0 1 660,400" fill="none" stroke="#f7b2ec" stroke-width="4" opacity="0.6"/>

  <!-- Cap + fuse -->
  <path d="M512,315 L512,265 L600,245 L640,265 L640,305 L512,330 Z" fill="url(#cap)" stroke="#e879d0" stroke-width="3" transform="translate(-60,0)"/>
  <path d="M590,255 C640,215 680,205 730,225" fill="none" stroke="#3a123d" stroke-width="16" stroke-linecap="round"/>
  <path d="M590,255 C640,215 680,205 730,225" fill="none" stroke="#f0a0e8" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>

  <!-- Spark burst at fuse tip -->
  <g transform="translate(745,215)" filter="url(#glow)">
    <use href="#spark" fill="#ffd6f5" transform="scale(1.2)"/>
    <use href="#spark" fill="#f0a0e8" transform="rotate(45) scale(0.7)"/>
    <use href="#spark" fill="#f0a0e8" transform="rotate(20) scale(0.45)"/>
  </g>
  <g stroke="#f7b2ec" stroke-width="3" opacity="0.9">
    <line x1="750" y1="140" x2="760" y2="100"/>
    <line x1="800" y1="165" x2="840" y2="140"/>
    <line x1="705" y1="170" x2="680" y2="135"/>
    <line x1="770" y1="265" x2="800" y2="295"/>
  </g>

  <!-- Center sakura flower (5 petals) -->
  <g transform="translate(512,520)" filter="url(#glow)">
    <use href="#sakuraPetal" fill="url(#petal)" stroke="#a83aa3" stroke-width="2" transform="rotate(-90) translate(0,-20)"/>
    <use href="#sakuraPetal" fill="url(#petal)" stroke="#a83aa3" stroke-width="2" transform="rotate(-18) translate(0,-20)"/>
    <use href="#sakuraPetal" fill="url(#petal)" stroke="#a83aa3" stroke-width="2" transform="rotate(54) translate(0,-20)"/>
    <use href="#sakuraPetal" fill="url(#petal)" stroke="#a83aa3" stroke-width="2" transform="rotate(126) translate(0,-20)"/>
    <use href="#sakuraPetal" fill="url(#petal)" stroke="#a83aa3" stroke-width="2" transform="rotate(198) translate(0,-20)"/>
    <circle r="16" fill="url(#flowerCenter)"/>
    <circle r="6" fill="#fff0fb"/>
  </g>

  <!-- Floating petals -->
  <g fill="url(#petal)" opacity="0.9">
    <use href="#sakuraPetal" transform="translate(280,250) rotate(30) scale(0.8)"/>
    <use href="#sakuraPetal" transform="translate(760,300) rotate(160) scale(0.6)"/>
    <use href="#sakuraPetal" transform="translate(300,760) rotate(220) scale(0.9)"/>
    <use href="#sakuraPetal" transform="translate(720,770) rotate(300) scale(0.7)"/>
    <use href="#sakuraPetal" transform="translate(150,470) rotate(80) scale(0.5)"/>
    <use href="#sakuraPetal" transform="translate(820,470) rotate(260) scale(0.8)"/>
    <use href="#sakuraPetal" transform="translate(380,200) rotate(10) scale(0.4)"/>
    <use href="#sakuraPetal" transform="translate(620,870) rotate(140) scale(0.8)"/>
  </g>

  <!-- Sparkle stars on axes -->
  <g fill="#f7b2ec" filter="url(#glow)">
    <use href="#spark" transform="translate(512,130) scale(0.9)"/>
    <use href="#spark" transform="translate(512,920) scale(0.9)"/>
    <use href="#spark" transform="translate(160,505) scale(0.9)"/>
    <use href="#spark" transform="translate(865,505) scale(0.9)"/>
  </g>
  <g fill="#e879d0" opacity="0.8">
    <use href="#spark" transform="translate(330,300) scale(0.3)"/>
    <use href="#spark" transform="translate(700,760) scale(0.3)"/>
    <use href="#spark" transform="translate(240,620) scale(0.25)"/>
    <use href="#spark" transform="translate(760,640) scale(0.25)"/>
  </g>
</svg>
